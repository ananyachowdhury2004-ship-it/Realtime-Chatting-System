server:
  port: 8080

spring:
  application:
    name: chat-backend

  datasource:
    url: jdbc:mysql://localhost:3306/chatdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "1234"

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  # CHANGE THIS IN PRODUCTION
  secret: "replace-this-with-a-long-random-base64-secret-at-least-256-bits-1234567890"
  expiration-ms: 86400000

app:
  upload-dir: uploads
  encryption:
    key: "yzpjRSPmcV+LUCod25DQJG36sKlcEOARSnj3O44FL9U="