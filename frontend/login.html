<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css\login.css">
    <title>Document</title>
</head>
<body>
    <div class="card">
        <h2>Login Here</h2>
        <p id="welcome"> Please enter your details</p>
        <form id="loginForm">
        <label for="Email">Email</label>
        <input type="email" id="email" name="email" placeholder="You@gmail.com" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required minlength="6">
        <button type="submit">Log in</button>
        </form>
        <div class="last">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
