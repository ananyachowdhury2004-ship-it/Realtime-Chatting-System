<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css\register.css">
</head>
<body>
    <div class="register">
    <h2>Register Here</h2>
    <form id="registerForm">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>
        <label for="email">Email</label>
        <input type="email"id="email" placeholder="Enter your email" required>
        <label for="tel">Mobile</label>
        <input type="tel" id="tel" inputmode="tel" autocomplete="tel" minlength="10" maxlength="20" placeholder="Enter your mobile no (unique)" required>
        <label for="user_type">User type</label>
        <select id="user_type" required>
            <option value=""> Select user type</option>
            <option value="">User</option>
            <option value="">Admin</option>
            <option value="">Super admin</option>
        </select>
        <label for="password">Password</label>
        <input type="password"id="password" placeholder="Enter your password" required>
        <label for="confirm_pass">Confirm password</label>
        <input type="password" id="confirm_pass" placeholder="Confirm your password" required>
        <button type="submit">Sign in</button>
    </form>
    <p class="login">Already have an account?
    <a href="login.html">login</a>
    </p>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
